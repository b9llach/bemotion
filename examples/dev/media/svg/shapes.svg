<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 320 200">
  <!-- Mixed elements for the svg layer's file import: every basic shape, a group transform, paints. -->
  <rect x="10" y="10" width="90" height="60" rx="10" fill="#4F46E5" />
  <circle cx="160" cy="40" r="30" fill="none" stroke="#F59E0B" stroke-width="6" />
  <ellipse cx="260" cy="40" rx="45" ry="25" fill="#10B981" stroke="#065F46" stroke-width="4" />
  <line x1="20" y1="110" x2="120" y2="150" stroke="#EF4444" stroke-width="8" stroke-linecap="round" />
  <polyline points="140,150 160,110 180,150 200,110 220,150" fill="none" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="270,100 300,160 240,160" fill="rgb(236, 72, 153)" />
  <g transform="translate(160 175) rotate(-8)">
    <path d="M-60 0 C-30 -25 30 25 60 0" fill="none" stroke="purple" stroke-width="5" stroke-linecap="round" />
    <g transform="scale(0.5)">
      <rect x="-20" y="-20" width="40" height="40" fill="orange" />
    </g>
  </g>
</svg>
